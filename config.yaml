funding_scanner:
  min_rate: 0.0002  # Minimum funding rate to show (0.02%)
  max_spread_bps: 8.0  # Maximum spread in basis points
  refresh_sec: 10  # Auto refresh interval in seconds

trading:
  max_notional_per_symbol: 2000.0  # Maximum USDT notional per symbol
  max_total_notional: 5000.0  # Maximum total USDT notional across all positions
  min_free_margin_pct: 30.0  # Minimum free margin percentage required
  default_leverage: 1  # Default leverage for futures (1x = no leverage)
  taker_fee_bps_spot: 10.0  # Taker fee for spot in basis points (0.1%)
  taker_fee_bps_perp: 4.0  # Taker fee for perp in basis points (0.04%)
  paper_mode: true  # Paper mode (dry-run) - set to false for live trading
