# Nixpacks configuration for Railway
# This ensures both Node.js and Python are available
# Explicitly specify Node.js 20 to avoid conflicts with auto-detected Node.js 24

[phases.setup]
nixPkgs = ["nodejs_20", "python311", "python311Packages.pip"]

[phases.install]
cmds = [
  "npm install",
  "cd frontend && npm install",
  "pip install -r backend/requirements.txt"
]

[phases.build]
cmds = [
  "cd frontend && npm run build"
]

[start]
cmd = "cd backend && python3 -m app.main"
