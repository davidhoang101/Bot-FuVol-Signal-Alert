# Nixpacks configuration for Railway
# This ensures both Node.js and Python are available
# Note: pip comes with python311, no need to specify separately

[phases.setup]
nixPkgs = ["nodejs_20", "python311"]

[phases.install]
cmds = [
  "npm install",
  "cd frontend && npm install",
  "python3 -m pip install -r backend/requirements.txt"
]

[phases.build]
cmds = [
  "cd frontend && npm run build"
]

[start]
cmd = "cd backend && python3 -m app.main"
